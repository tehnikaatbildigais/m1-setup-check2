# Ezermalas pieteikumu sistēma · iesniegumu API · līgums v0
# Līgumu maina analītiķis. Katra izmaiņa: atsevišķs komits ar pieteikuma ID.

openapi: 3.0.3
info:
  title: Ezermalas pieteikumu sistēma · iesniegumu API
  version: 0.1.0
  description: |
    Iedzīvotāju iesniegumu pieņemšana un apskate.

    Šis līgums ir analītiķa artefakts un patiesības avots (source of truth).
    Ja programma atbild citādi, nekā rakstīts šeit, tā ir kļūda programmā
    vai līgumā, un par to jālemj.

    > Noteikumi vienkāršoti mācību vajadzībām. Ezermalas novada pašvaldība
    > un OMD reģistrs ir izdomāti. Visi dati ir sintētiski.
servers:
  - url: http://localhost:8000
    description: Lokālais prototips (Codespace)
tags:
  - name: Iesniegumi
    description: Iesnieguma pieņemšana un apskate (R1–R3)
  - name: Sistēma
    description: Tehniskie galapunkti (R4)
  - name: Lietotāji
    description: Reģistrācija, pieteikšanās un paroles atjaunošana (CR-4)
  - name: CRM
    description: |
      Ezermalas CRM HTML ekrāni (CR-5). Servera pusē renderēts HTML, formas
      `application/x-www-form-urlencoded`. Kļūdas pārlūkam ir HTML lapas, citiem
      klientiem kopīgā `Error` shēma.

paths:
  /health:
    get:
      tags: [Sistēma]
      operationId: getHealth
      summary: Vai serviss darbojas
      responses:
        '200':
          description: Serviss darbojas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /submissions:
    post:
      tags: [Iesniegumi]
      operationId: createSubmission
      summary: Iesniegt iesniegumu
      description: |
        Pieņem iesniegumu, piešķir ID, statusu `RECEIVED`, saņemšanas laiku
        un atbildes termiņu.

        **Atbildes kanāls (CR-2).** Pēc saņemšanas sistēma pārbauda
        iesniedzēja oficiālo e-adresi OMD reģistrā un nosaka `replyChannel`:
        - OMD `ACTIVE` → `E_ADDRESS`, neatkarīgi no `preferredChannel`.
        - OMD `NOT_ACTIVATED` → `preferredChannel`. Ja izvēlēts `E_ADDRESS`,
          bet e-adrese nav aktivizēta: `EMAIL`, un `reasonCode` norāda iemeslu.
        - OMD 404 (reģistrā nav ieraksta) → tāpat kā `NOT_ACTIVATED`.

        *CR-2 daļa nav pabeigta: skatīt `tracker/CR-2.md` un A1.*
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionCreate'
            example:
              personalCode: '32000000001'
              fullName: Līga Ozoliņa-Kalniņa
              email: liga@example.com
              preferredChannel: EMAIL
              topic: ROADS
              subject: Bedre Ezera ielā
              body: Pie Ezera ielas 12 ir liela bedre. Lūdzu, salabojiet to.
      responses:
        '201':
          description: Iesniegums pieņemts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionCreated'
        '400':
          $ref: '#/components/responses/ValidationError'

  /submissions/{id}:
    get:
      tags: [Iesniegumi]
      operationId: getSubmission
      summary: Iesniegums pēc ID
      description: Darbinieks atver vienu iesniegumu pēc tā ID.
      parameters:
        - name: id
          in: path
          required: true
          description: Iesnieguma ID
          schema:
            type: string
            example: IES-2026-000123
      responses:
        '200':
          description: Iesniegums atrasts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/register:
    post:
      tags: [Lietotāji]
      operationId: registerUser
      summary: Reģistrēt lietotāju (CR-4)
      description: |
        Izveido lietotāja kontu.
        - `email` un `username` ir unikāli un reģistrjutīgi
          (`Janis` un `janis` ir dažādi lietotājvārdi).
        - `username` nedrīkst būt tukšs, saturēt tikai atstarpes vai saturēt `@`.
        - `password`: vismaz 8 simboli; `passwordConfirm` jāsakrīt ar `password`.
        - Parole tiek glabāta tikai kā sāļota jaucējvērtība (scrypt).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: janis@example.com
              username: janis
              password: ezera-iela-12
              passwordConfirm: ezera-iela-12
      responses:
        '201':
          description: Konts izveidots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreated'
        '400':
          $ref: '#/components/responses/AuthValidationError'
        '404':
          $ref: '#/components/responses/RouteNotFound'
        '409':
          $ref: '#/components/responses/UserConflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/login:
    post:
      tags: [Lietotāji]
      operationId: loginUser
      summary: Pieteikties (CR-4)
      description: |
        `login` ir e-pasts vai lietotājvārds. Ja tas satur `@`, to meklē kā
        e-pastu, citādi kā lietotājvārdu. Salīdzināšana ir reģistrjutīga.

        Veiksmīgas pieteikšanās gadījumā tiek atvērta sesija ar `HttpOnly`
        sīkdatni `session`.

        **Bloķēšana.** Pēc 3 nepareizām parolēm pēc kārtas konts tiek bloķēts
        uz 5 minūtēm. Bloķēšanas laikā arī pareiza parole atgriež `401`, un
        mēģinājumi netiek skaitīti. Veiksmīga pieteikšanās nonullē kļūdu skaitu.

        Nepareiza parole, neesošs lietotājs un bloķēts konts atgriež vienu un
        to pašu `401` atbildi, lai nevarētu noteikt, vai konts eksistē.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: janis@example.com
              password: ezera-iela-12
      responses:
        '200':
          description: Pieteikšanās izdevās, sesija atvērta
          headers:
            Set-Cookie:
              description: '`session=<marķieris>; HttpOnly; Path=/; SameSite=lax`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/AuthValidationError'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '404':
          $ref: '#/components/responses/RouteNotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/logout:
    post:
      tags: [Lietotāji]
      operationId: logoutUser
      summary: Iziet (CR-4)
      description: |
        Beidz sesiju un dzēš sīkdatni `session`. Atbilde ir `204` arī tad,
        ja sesijas nav (darbība ir idempotenta).
      parameters:
        - name: session
          in: cookie
          required: false
          description: Sesijas marķieris
          schema:
            type: string
      responses:
        '204':
          description: Sesija beigta
        '400':
          $ref: '#/components/responses/AuthValidationError'
        '404':
          $ref: '#/components/responses/RouteNotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/password-reset:
    post:
      tags: [Lietotāji]
      operationId: requestPasswordReset
      summary: Pieprasīt paroles atjaunošanas saiti (CR-4)
      description: |
        Ja e-pasts ir reģistrēts, izveido vienreizēju saiti, kas derīga
        30 minūtes. Atbilde ir vienāda neatkarīgi no tā, vai e-pasts ir
        reģistrēts.

        *Prototipā saite tiek ierakstīta servera žurnālā, e-pasts netiek
        sūtīts. Pirms publiskas izvietošanas jāaizstāj ar e-pasta sūtīšanu.*
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              email: janis@example.com
      responses:
        '202':
          description: Pieprasījums pieņemts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: If the e-mail is registered, a reset link has been issued
        '400':
          $ref: '#/components/responses/AuthValidationError'
        '404':
          $ref: '#/components/responses/RouteNotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/password-reset/confirm:
    post:
      tags: [Lietotāji]
      operationId: confirmPasswordReset
      summary: Iestatīt jaunu paroli ar atjaunošanas marķieri (CR-4)
      description: |
        Nomaina paroli. Pēc tam vecā parole vairs nedarbojas, marķieri nevar
        izmantot otrreiz, konta bloķēšana tiek noņemta un visas lietotāja
        sesijas tiek beigtas. Beidzies, izmantots vai neesošs marķieris
        atgriež `400` ar `field: token`, `issue: INVALID_OR_EXPIRED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
      responses:
        '200':
          description: Parole nomainīta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Password has been changed
        '400':
          $ref: '#/components/responses/AuthValidationError'
        '404':
          $ref: '#/components/responses/RouteNotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /:
    get:
      tags: [CRM]
      operationId: crmRoot
      summary: "Pāradresē uz CRM sākumlapu"
      responses:
        '303':
          $ref: '#/components/responses/SeeOther'
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
        '404':
          $ref: '#/components/responses/HtmlNotFound'
        '500':
          $ref: '#/components/responses/HtmlServerError'

  /sakums:
    get:
      tags: [CRM]
      operationId: crmHome
      summary: "Sākumlapa: darbinieka izvēle (N3, mācību režīms)"
      description: |
        Darbinieku saraksts ar lomām, bez paroles.
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
        '404':
          $ref: '#/components/responses/HtmlNotFound'
        '500':
          $ref: '#/components/responses/HtmlServerError'
    post:
      tags: [CRM]
      operationId: crmChooseEmployee
      summary: "Izvēlēties darbinieku"
      description: |
        Saglabā izvēli sīkdatnē `crm_darbinieks` un pāradresē uz `/kopsavilkums`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmployeeChoiceForm'
      responses:
        '303':
          $ref: '#/components/responses/SeeOtherWithCookie'
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
        '404':
          $ref: '#/components/responses/HtmlNotFound'
        '500':
          $ref: '#/components/responses/HtmlServerError'

  /kopsavilkums:
    get:
      tags: [CRM]
      operationId: crmDashboard
      summary: "Kopsavilkums pēc ienākšanas (F9)"
      description: |
        Mani uzdevumi šodien; kavētie un tuvojošies (7 dienas) pieprasījumi manās organizācijās; pēdējo 7 dienu mijiedarbības (savas organizācijas un paša reģistrētās). Vadītājam un administratoram arī iestādes kopskaitļi, visi kavētie pieprasījumi un visas mijiedarbības; administratoram arī kontaktu skaits ar beigušos glabāšanas termiņu.
      parameters:
        - $ref: '#/components/parameters/CrmEmployeeCookie'
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '303':
          $ref: '#/components/responses/SeeOther'
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
        '404':
          $ref: '#/components/responses/HtmlNotFound'
        '500':
          $ref: '#/components/responses/HtmlServerError'

  /organizacijas:
    get:
      tags: [CRM]
      operationId: crmOrgList
      summary: "Organizāciju saraksts (F1)"
      description: |
        Visas organizācijas; savējās atzīmētas ar tekstu „Mana”.
      parameters:
        - name: 'mans'
          in: query
          required: false
          description: "`1` — tikai organizācijas, kurās esmu atbildīgais"
          schema:
            type: string
        - $ref: '#/components/parameters/CrmEmployeeCookie'
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '303':
          $ref: '#/components/responses/SeeOther'
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
        '404':
          $ref: '#/components/responses/HtmlNotFound'
        '500':
          $ref: '#/components/responses/HtmlServerError'

  /organizacijas/jauna:
    get:
      tags: [CRM]
      operationId: crmOrgNewForm
      summary: "Jaunas organizācijas forma (F1)"
      parameters:
        - $ref: '#/components/parameters/CrmEmployeeCookie'
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '303':
          $ref: '#/components/responses/SeeOther'
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
        '404':
          $ref: '#/components/responses/HtmlNotFound'
        '500':
          $ref: '#/components/responses/HtmlServerError'
    post:
      tags: [CRM]
      operationId: crmOrgCreate
      summary: "Izveidot organizāciju (F1)"
      description: |
        Reģ. nr.: 11 cipari, unikāls. Veids: `uznemums`, `nvo`, `pasvaldiba`.
      parameters:
        - $ref: '#/components/parameters/CrmEmployeeCookie'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizationForm'
      responses:
        '303':
          $ref: '#/components/responses/SeeOther'
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
        '404':
          $ref: '#/components/responses/HtmlNotFound'
        '500':
          $ref: '#/components/responses/HtmlServerError'

  /organizacijas/{orgId}:
    get:
      tags: [CRM]
      operationId: crmOrgCard
      summary: "Organizācijas kartīte (F1–F5)"
      description: |
        Kontaktpersonas, mijiedarbību hronoloģija (jaunākā augšā), pieprasījumi, uzdevumi. Atvēršana tiek ierakstīta piekļuves žurnālā (N2).
      parameters:
        - name: 'orgId'
          in: path
          required: true
          description: "Organizācijas ID"
          schema:
            type: integer
        - $ref: '#/components/parameters/CrmEmployeeCookie'
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '303':
          $ref: '#/components/responses/SeeOther'
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
        '404':
          $ref: '#/components/responses/HtmlNotFound'
        '500':
          $ref: '#/components/responses/HtmlServerError'

  /organizacijas/{orgId}/labot:
    get:
      tags: [CRM]
      operationId: crmOrgEditForm
      summary: "Organizācijas labošanas forma"
      description: |
        Atbildīgais darbinieks, vadītājs vai administrators.
      parameters:
        - name: 'orgId'
          in: path
          required: true
          description: "Organizācijas ID"
          schema:
            type: integer
        - $ref: '#/components/parameters/CrmEmployeeCookie'
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '303':
          $ref: '#/components/responses/SeeOther'
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
        '403':
          $ref: '#/components/responses/HtmlForbidden'
        '404':
          $ref: '#/components/responses/HtmlNotFound'
        '500':
          $ref: '#/components/responses/HtmlServerError'
    post:
      tags: [CRM]
      operationId: crmOrgUpdate
      summary: "Saglabāt organizāciju"
      parameters:
        - name: 'orgId'
          in: path
          required: true
