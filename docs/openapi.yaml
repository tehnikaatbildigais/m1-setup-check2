              $ref: '#/components/schemas/OrganizationForm'
      responses:
        '303':
          $ref: '#/components/responses/SeeOther'
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
        '403':
          $ref: '#/components/responses/HtmlForbidden'
        '404':
          $ref: '#/components/responses/HtmlNotFound'
        '500':
          $ref: '#/components/responses/HtmlServerError'

