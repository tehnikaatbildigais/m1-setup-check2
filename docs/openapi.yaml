        - $ref: '#/components/parameters/CrmEmployeeCookie'
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '303':
          $ref: '#/components/responses/SeeOther'
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
        '403':
          $ref: '#/components/responses/HtmlForbidden'
        '404':
          $ref: '#/components/responses/HtmlNotFound'
        '500':
          $ref: '#/components/responses/HtmlServerError'
    post:
      tags: [CRM]
      operationId: crmInteractionCreate
      summary: "Ģenerēt kopsavilkumu vai saglabāt mijiedarbību (F3, MI-1)"
      description: |
        `action=generate`: atgriež formu (200) ar ≤ 3 teikumu kopsavilkumu un nākamo soli, marķētiem „Ģenerēts ar MI”; nekas netiek saglabāts. Bez `ANTHROPIC_API_KEY` izmanto imitāciju; Claude kļūdas gadījumā arī imitāciju ar paziņojumu.

        `action=save`: saglabā. Ja `ai_generated=1`, ieraksts tiek marķēts un apstiprinātājs ir pašreizējais darbinieks. Brīvās piezīmes (`notes`) netiek saglabātas.
      parameters:
        - name: 'orgId'
          in: path
          required: true
          description: "Organizācijas ID"
          schema:
            type: integer
        - $ref: '#/components/parameters/CrmEmployeeCookie'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InteractionForm'
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '303':
          $ref: '#/components/responses/SeeOther'
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
        '403':
          $ref: '#/components/responses/HtmlForbidden'
        '404':
          $ref: '#/components/responses/HtmlNotFound'
        '500':
          $ref: '#/components/responses/HtmlServerError'

