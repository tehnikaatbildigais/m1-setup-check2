          $ref: '#/components/responses/HtmlForbidden'
        '404':
          $ref: '#/components/responses/HtmlNotFound'
        '500':
          $ref: '#/components/responses/HtmlServerError'

  /organizacijas/{orgId}/mijiedarbibas/jauna:
    get:
      tags: [CRM]
      operationId: crmInteractionNewForm
      summary: "Jaunas mijiedarbības forma (F3)"
