        - $ref: '#/components/parameters/CrmEmployeeCookie'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ContactForm'
      responses:
        '303':
          $ref: '#/components/responses/SeeOther'
        '400':
          $ref: '#/components/responses/HtmlBadRequest'
        '403':
          $ref: '#/components/responses/HtmlForbidden'
        '404':
          $ref: '#/components/responses/HtmlNotFound'
        '500':
          $ref: '#/components/responses/HtmlServerError'

  /kontakti/{contactId}/dzest:
    get:
      tags: [CRM]
      operationId: crmContactDeleteConfirm
      summary: "Kontaktpersonas dzēšanas apstiprinājums (N2)"
      description: |
        Tikai administrators.
      parameters:
        - name: 'contactId'
          in: path
          required: true
          description: "Kontaktpersonas ID"
          schema:
            type: integer
        - $ref: '#/components/parameters/CrmEmployeeCookie'
