# Ezermalas pieteikumu sistēma · iesniegumu API · līgums v0
# Līgumu maina analītiķis. Katra izmaiņa: atsevišķs komits ar pieteikuma ID.

openapi: 3.0.3
info:
  title: Ezermalas pieteikumu sistēma · iesniegumu API
  version: 0.1.0
  description: |
    Iedzīvotāju iesniegumu pieņemšana un apskate.

    Šis līgums ir analītiķa artefakts un patiesības avots (source of truth).
    Ja programma atbild citādi, nekā rakstīts šeit, tā ir kļūda programmā
    vai līgumā, un par to jālemj.

    > Noteikumi vienkāršoti mācību vajadzībām. Ezermalas novada pašvaldība
    > un OMD reģistrs ir izdomāti. Visi dati ir sintētiski.
servers:
  - url: http://localhost:8000
    description: Lokālais prototips (Codespace)
tags:
  - name: Iesniegumi
    description: Iesnieguma pieņemšana un apskate (R1–R3)
  - name: Sistēma
    description: Tehniskie galapunkti (R4)
  - name: Lietotāji
    description: Reģistrācija, pieteikšanās un paroles atjaunošana (CR-4)

paths:
  /health:
    get:
      tags: [Sistēma]
      operationId: getHealth
      summary: Vai serviss darbojas
      responses:
        '200':
          description: Serviss darbojas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /submissions:
    post:
      tags: [Iesniegumi]
      operationId: createSubmission
      summary: Iesniegt iesniegumu
      description: |
        Pieņem iesniegumu, piešķir ID, statusu `RECEIVED`, saņemšanas laiku
        un atbildes termiņu.

        **Atbildes kanāls (CR-2).** Pēc saņemšanas sistēma pārbauda
        iesniedzēja oficiālo e-adresi OMD reģistrā un nosaka `replyChannel`:
        - OMD `ACTIVE` → `E_ADDRESS`, neatkarīgi no `preferredChannel`.
        - OMD `NOT_ACTIVATED` → `preferredChannel`. Ja izvēlēts `E_ADDRESS`,
          bet e-adrese nav aktivizēta: `EMAIL`, un `reasonCode` norāda iemeslu.
        - OMD 404 (reģistrā nav ieraksta) → tāpat kā `NOT_ACTIVATED`.

        *CR-2 daļa nav pabeigta: skatīt `tracker/CR-2.md` un A1.*
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionCreate'
            example:
              personalCode: '32000000001'
              fullName: Līga Ozoliņa-Kalniņa
              email: liga@example.com
              preferredChannel: EMAIL
              topic: ROADS
              subject: Bedre Ezera ielā
              body: Pie Ezera ielas 12 ir liela bedre. Lūdzu, salabojiet to.
      responses:
        '201':
          description: Iesniegums pieņemts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionCreated'
        '400':
          $ref: '#/components/responses/ValidationError'

  /submissions/{id}:
    get:
      tags: [Iesniegumi]
      operationId: getSubmission
      summary: Iesniegums pēc ID
      description: Darbinieks atver vienu iesniegumu pēc tā ID.
      parameters:
        - name: id
          in: path
          required: true
          description: Iesnieguma ID
          schema:
            type: string
            example: IES-2026-000123
      responses:
        '200':
          description: Iesniegums atrasts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/register:
    post:
      tags: [Lietotāji]
      operationId: registerUser
      summary: Reģistrēt lietotāju (CR-4)
      description: |
        Izveido lietotāja kontu.
        - `email` un `username` ir unikāli un reģistrjutīgi
          (`Janis` un `janis` ir dažādi lietotājvārdi).
        - `username` nedrīkst būt tukšs, saturēt tikai atstarpes vai saturēt `@`.
        - `password`: vismaz 8 simboli; `passwordConfirm` jāsakrīt ar `password`.
        - Parole tiek glabāta tikai kā sāļota jaucējvērtība (scrypt).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: janis@example.com
              username: janis
              password: ezera-iela-12
              passwordConfirm: ezera-iela-12
      responses:
        '201':
          description: Konts izveidots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreated'
        '400':
          $ref: '#/components/responses/AuthValidationError'
        '404':
          $ref: '#/components/responses/RouteNotFound'
        '409':
          $ref: '#/components/responses/UserConflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/login:
    post:
      tags: [Lietotāji]
      operationId: loginUser
      summary: Pieteikties (CR-4)
      description: |
        `login` ir e-pasts vai lietotājvārds. Ja tas satur `@`, to meklē kā
        e-pastu, citādi kā lietotājvārdu. Salīdzināšana ir reģistrjutīga.

        Veiksmīgas pieteikšanās gadījumā tiek atvērta sesija ar `HttpOnly`
        sīkdatni `session`.

        **Bloķēšana.** Pēc 3 nepareizām parolēm pēc kārtas konts tiek bloķēts
        uz 5 minūtēm. Bloķēšanas laikā arī pareiza parole atgriež `401`, un
        mēģinājumi netiek skaitīti. Veiksmīga pieteikšanās nonullē kļūdu skaitu.

        Nepareiza parole, neesošs lietotājs un bloķēts konts atgriež vienu un
        to pašu `401` atbildi, lai nevarētu noteikt, vai konts eksistē.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: janis@example.com
              password: ezera-iela-12
      responses:
        '200':
          description: Pieteikšanās izdevās, sesija atvērta
          headers:
            Set-Cookie:
              description: '`session=<marķieris>; HttpOnly; Path=/; SameSite=lax`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/AuthValidationError'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '404':
          $ref: '#/components/responses/RouteNotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/logout:
    post:
      tags: [Lietotāji]
      operationId: logoutUser
      summary: Iziet (CR-4)
      description: |
        Beidz sesiju un dzēš sīkdatni `session`. Atbilde ir `204` arī tad,
        ja sesijas nav (darbība ir idempotenta).
      parameters:
        - name: session
          in: cookie
          required: false
          description: Sesijas marķieris
          schema:
            type: string
      responses:
        '204':
          description: Sesija beigta
        '400':
          $ref: '#/components/responses/AuthValidationError'
        '404':
          $ref: '#/components/responses/RouteNotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/password-reset:
    post:
      tags: [Lietotāji]
      operationId: requestPasswordReset
      summary: Pieprasīt paroles atjaunošanas saiti (CR-4)
      description: |
        Ja e-pasts ir reģistrēts, izveido vienreizēju saiti, kas derīga
        30 minūtes. Atbilde ir vienāda neatkarīgi no tā, vai e-pasts ir
        reģistrēts.

        *Prototipā saite tiek ierakstīta servera žurnālā, e-pasts netiek
        sūtīts. Pirms publiskas izvietošanas jāaizstāj ar e-pasta sūtīšanu.*
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              email: janis@example.com
      responses:
        '202':
          description: Pieprasījums pieņemts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: If the e-mail is registered, a reset link has been issued
        '400':
          $ref: '#/components/responses/AuthValidationError'
        '404':
          $ref: '#/components/responses/RouteNotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/password-reset/confirm:
    post:
      tags: [Lietotāji]
      operationId: confirmPasswordReset
      summary: Iestatīt jaunu paroli ar atjaunošanas marķieri (CR-4)
      description: |
        Nomaina paroli. Pēc tam vecā parole vairs nedarbojas, marķieri nevar
        izmantot otrreiz, konta bloķēšana tiek noņemta un visas lietotāja
        sesijas tiek beigtas. Beidzies, izmantots vai neesošs marķieris
        atgriež `400` ar `field: token`, `issue: INVALID_OR_EXPIRED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
      responses:
        '200':
          description: Parole nomainīta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Password has been changed
        '400':
          $ref: '#/components/responses/AuthValidationError'
        '404':
          $ref: '#/components/responses/RouteNotFound'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: 0.1.0

    SubmissionCreate:
      type: object
      required:
        - personalCode
        - fullName
        - email
        - preferredChannel
        - topic
        - subject
        - body
      properties:
        personalCode:
          type: string
          description: Iesniedzēja personas kods
          example: '32000000001'
        fullName:
          type: string
          description: Iesniedzēja vārds un uzvārds
          example: Jānis Bērziņš
        email:
          type: string
          format: email
          description: Iesniedzēja e-pasts
          example: janis@example.com
        preferredChannel:
          $ref: '#/components/schemas/PreferredChannel'
        topic:
          $ref: '#/components/schemas/Topic'
        subject:
          type: string
          description: Iesnieguma temats
          example: Bedre Ezera ielā
        body:
          type: string
          description: Iesnieguma teksts
          example: Pie Ezera ielas 12 ir liela bedre. Lūdzu, salabojiet to.

    SubmissionCreated:
      type: object
      required: [id, status, receivedAt, dueDate, replyChannel]
      properties:
        id:
          type: string
          description: Iesnieguma ID
          example: IES-2026-000123
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        receivedAt:
          type: string
          format: date-time
          description: Saņemšanas laiks
          example: '2026-10-01T09:15:00Z'
        dueDate:
          type: string
          description: Atbildes termiņš
          example: '2026-11-02'
        replyChannel:
          $ref: '#/components/schemas/ReplyChannel'
        reasonCode:
          type: string
          nullable: true
          description: |
            Kāpēc `replyChannel` atšķiras no `preferredChannel`.
            `null`, ja kanāls sakrīt. *CR-2: vērtību saraksts nav pabeigts.*
          example: E_ADDRESS_NOT_ACTIVE

    Submission:
      description: Pilns iesnieguma ieraksts
      allOf:
        - $ref: '#/components/schemas/SubmissionCreated'
        - $ref: '#/components/schemas/SubmissionCreate'

    PreferredChannel:
      type: string
      description: Kā iesniedzējs vēlas saņemt atbildi
      enum: [EMAIL, POST, E_ADDRESS]
      example: EMAIL

    ReplyChannel:
      type: string
      description: |
        Kanāls, pa kuru sūtīs atbildi (nosaka sistēma, CR-2).
        *CR-2: vērtību saraksts nav pabeigts.*
      enum: [EMAIL, POST, E_ADDRESS]
      example: E_ADDRESS

    Topic:
      type: string
      description: |
        Iesnieguma tēma:
        `ROADS` Ceļi un ielas · `WASTE` Atkritumi ·
        `PLANNING` Teritorijas plānošana · `OTHER` Cits
      enum: [ROADS, WASTE, PLANNING, OTHER]
      example: ROADS

    SubmissionStatus:
      type: string
      description: Iesnieguma statuss. Jauns iesniegums vienmēr ir `RECEIVED`.
      enum: [RECEIVED, IN_PROGRESS, FORWARDED, ANSWERED, WITHDRAWN]
      example: RECEIVED

    RegisterRequest:
      type: object
      required: [email, username, password, passwordConfirm]
      properties:
        email:
          type: string
          format: email
          example: janis@example.com
        username:
          type: string
          description: Jebkuri simboli, izņemot `@`; nav tukšs
          example: janis
        password:
          type: string
          format: password
          minLength: 8
        passwordConfirm:
          type: string
          format: password

    UserCreated:
      type: object
      required: [email, username]
      properties:
        email:
          type: string
          format: email
          example: janis@example.com
        username:
          type: string
          example: janis

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          description: E-pasts vai lietotājvārds
          example: janis
        password:
          type: string
          format: password

    LoginResult:
      type: object
      required: [username]
      properties:
        username:
          type: string
          example: janis

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: janis@example.com

    PasswordResetConfirm:
      type: object
      required: [token, password, passwordConfirm]
      properties:
        token:
          type: string
          description: Marķieris no atjaunošanas saites
        password:
          type: string
          format: password
          minLength: 8
        passwordConfirm:
          type: string
          format: password

    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string

    Error:
      type: object
      description: Vienota kļūdu shēma visiem galapunktiem
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Kļūdas kods, piemēram, `VALIDATION_ERROR` vai `NOT_FOUND`
              example: VALIDATION_ERROR
            message:
              type: string
              description: Cilvēkam lasāms apraksts. Bez personas datiem.
              example: Request validation failed
            details:
              type: array
              description: Katra lauka kļūda atsevišķi (tikai `VALIDATION_ERROR` un `CONFLICT`)
              items:
                type: object
                required: [field, issue]
                properties:
                  field:
                    type: string
                    example: personalCode
                  issue:
                    type: string
                    example: INVALID_FORMAT

  responses:
    ValidationError:
      description: Kļūdains pieprasījums. Iesniegums netiek saglabāts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - field: personalCode
                  issue: INVALID_FORMAT
    NotFound:
      description: Iesniegums ar šādu ID nav atrasts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Submission not found
    AuthValidationError:
      description: |
        Kļūdains pieprasījums. Iespējamās `issue` vērtības: `REQUIRED`,
        `INVALID_FORMAT`, `TOO_SHORT`, `MISMATCH`, `INVALID_OR_EXPIRED`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - field: password
                  issue: TOO_SHORT
    UserConflict:
      description: E-pasts un/vai lietotājvārds jau ir reģistrēts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: CONFLICT
              message: User already exists
              details:
                - field: email
                  issue: ALREADY_EXISTS
    InvalidCredentials:
      description: Nepareizi pieteikšanās dati vai konts īslaicīgi bloķēts (vienāda atbilde)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INVALID_CREDENTIALS
              message: Invalid login or password
    RouteNotFound:
      description: Pieprasītais ceļš nav atrasts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Not Found
    ServerError:
      description: Servera iekšēja kļūda. Atbildē nav ievades datu.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL_ERROR
              message: Internal server error
