components:
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: 0.1.0

    SubmissionCreate:
      type: object
      required:
        - personalCode
        - fullName
        - email
        - preferredChannel
        - topic
        - subject
        - body
      properties:
        personalCode:
          type: string
          description: Iesniedzēja personas kods
          example: '32000000001'
        fullName:
          type: string
          description: Iesniedzēja vārds un uzvārds
          example: Jānis Bērziņš
        email:
          type: string
          format: email
          description: Iesniedzēja e-pasts
          example: janis@example.com
        preferredChannel:
          $ref: '#/components/schemas/PreferredChannel'
        topic:
          $ref: '#/components/schemas/Topic'
        subject:
          type: string
          description: Iesnieguma temats
          example: Bedre Ezera ielā
        body:
          type: string
          description: Iesnieguma teksts
          example: Pie Ezera ielas 12 ir liela bedre. Lūdzu, salabojiet to.

    SubmissionCreated:
      type: object
      required: [id, status, receivedAt, dueDate, replyChannel]
      properties:
        id:
          type: string
          description: Iesnieguma ID
          example: IES-2026-000123
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        receivedAt:
          type: string
          format: date-time
          description: Saņemšanas laiks
          example: '2026-10-01T09:15:00Z'
        dueDate:
          type: string
          description: Atbildes termiņš
          example: '2026-11-02'
        replyChannel:
          $ref: '#/components/schemas/ReplyChannel'
        reasonCode:
          type: string
          nullable: true
          description: |
            Kāpēc `replyChannel` atšķiras no `preferredChannel`.
            `null`, ja kanāls sakrīt. *CR-2: vērtību saraksts nav pabeigts.*
          example: E_ADDRESS_NOT_ACTIVE

    Submission:
      description: Pilns iesnieguma ieraksts
      allOf:
        - $ref: '#/components/schemas/SubmissionCreated'
        - $ref: '#/components/schemas/SubmissionCreate'

    PreferredChannel:
      type: string
      description: Kā iesniedzējs vēlas saņemt atbildi
      enum: [EMAIL, POST, E_ADDRESS]
      example: EMAIL

    ReplyChannel:
      type: string
      description: |
        Kanāls, pa kuru sūtīs atbildi (nosaka sistēma, CR-2).
        *CR-2: vērtību saraksts nav pabeigts.*
      enum: [EMAIL, POST, E_ADDRESS]
      example: E_ADDRESS

    Topic:
      type: string
      description: |
        Iesnieguma tēma:
        `ROADS` Ceļi un ielas · `WASTE` Atkritumi ·
        `PLANNING` Teritorijas plānošana · `OTHER` Cits
      enum: [ROADS, WASTE, PLANNING, OTHER]
      example: ROADS

    SubmissionStatus:
      type: string
      description: Iesnieguma statuss. Jauns iesniegums vienmēr ir `RECEIVED`.
      enum: [RECEIVED, IN_PROGRESS, FORWARDED, ANSWERED, WITHDRAWN]
      example: RECEIVED

    RegisterRequest:
      type: object
      required: [email, username, password, passwordConfirm]
      properties:
        email:
          type: string
          format: email
          example: janis@example.com
        username:
          type: string
          description: Jebkuri simboli, izņemot `@`; nav tukšs
          example: janis
        password:
          type: string
          format: password
          minLength: 8
        passwordConfirm:
          type: string
          format: password

    UserCreated:
      type: object
      required: [email, username]
      properties:
        email:
          type: string
          format: email
          example: janis@example.com
        username:
          type: string
          example: janis

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          description: E-pasts vai lietotājvārds
          example: janis
        password:
          type: string
          format: password

    LoginResult:
      type: object
      required: [username]
      properties:
        username:
          type: string
          example: janis

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: janis@example.com

    PasswordResetConfirm:
      type: object
      required: [token, password, passwordConfirm]
      properties:
        token:
          type: string
          description: Marķieris no atjaunošanas saites
        password:
          type: string
          format: password
          minLength: 8
        passwordConfirm:
          type: string
          format: password

    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string

    OrganizationForm:
      type: object
      required: [name, reg_nr, type, responsible_id]
      properties:
        name:
          type: string
          maxLength: 200
        reg_nr:
          type: string
          pattern: '^[0-9]{11}$'
          description: Unikāls
        type:
          type: string
          enum: [uznemums, nvo, pasvaldiba]
        responsible_id:
          type: integer

    ContactForm:
      type: object
      required: [name, position, email, phone, basis, basis_date]
      properties:
        name:
          type: string
        position:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: '^(\+371)?[0-9]{8}$'
        basis:
          type: string
          description: Datu apstrādes tiesiskais pamats (VDAR 6. pants)
          enum: [Leģitīmās intereses, Līgums, Piekrišana, Juridisks pienākums, Sabiedrības intereses]
        basis_date:
          type: string
          format: date

    InteractionForm:
      type: object
      required: [action, kind, date]
      properties:
        action:
          type: string
          enum: [generate, save]
        kind:
          type: string
          enum: [zvans, epasts, sanaksme]
        date:
          type: string
          format: date
        participants:
          type: array
          description: Organizācijas kontaktpersonu ID
          items:
            type: integer
        notes:
          type: string
          maxLength: 8000
          description: Brīvas piezīmes MI kopsavilkumam; netiek saglabātas
        summary:
          type: string
          maxLength: 2000
          description: Obligāts, ja `action=save`
        next_step:
          type: string
          maxLength: 500
        ai_generated:
          type: string
          enum: ['', '1']

    RequestForm:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
          maxLength: 4000

    StatusForm:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [darba, atbildets]

    TaskForm:
      type: object
      required: [title, assignee_id, due]
      description: Jānorāda `organization_id`, `request_id` vai abi.
      properties:
        title:
          type: string
        assignee_id:
          type: integer
        due:
          type: string
          format: date
        organization_id:
          type: integer
        request_id:
          type: integer

    TaskDoneForm:
      type: object
      properties:
        return_to:
          type: string
          enum: [/uzdevumi, /kopsavilkums]
          description: Lapa pēc atzīmēšanas; cita vērtība → `/uzdevumi`

    EmployeeChoiceForm:
      type: object
      required: [employee_id]
      properties:
        employee_id:
          type: integer

    RoleForm:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [darbinieks, vaditajs, administrators]

    Error:
      type: object
      description: Vienota kļūdu shēma visiem galapunktiem
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Kļūdas kods, piemēram, `VALIDATION_ERROR` vai `NOT_FOUND`
              example: VALIDATION_ERROR
            message:
              type: string
              description: Cilvēkam lasāms apraksts. Bez personas datiem.
              example: Request validation failed
            details:
              type: array
              description: Katra lauka kļūda atsevišķi (tikai `VALIDATION_ERROR` un `CONFLICT`)
              items:
                type: object
                required: [field, issue]
                properties:
                  field:
                    type: string
                    example: personalCode
                  issue:
                    type: string
                    example: INVALID_FORMAT

  parameters:
    CrmEmployeeCookie:
      name: crm_darbinieks
      in: cookie
      required: false
      description: Izvēlētā darbinieka ID (mācību režīms, N3). Ja nav, → 303 uz `/sakums`.
      schema:
        type: integer

  responses:
    ValidationError:
      description: Kļūdains pieprasījums. Iesniegums netiek saglabāts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - field: personalCode
                  issue: INVALID_FORMAT
    NotFound:
      description: Iesniegums ar šādu ID nav atrasts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Submission not found
    AuthValidationError:
      description: |
        Kļūdains pieprasījums. Iespējamās `issue` vērtības: `REQUIRED`,
        `INVALID_FORMAT`, `TOO_SHORT`, `MISMATCH`, `INVALID_OR_EXPIRED`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - field: password
                  issue: TOO_SHORT
    UserConflict:
      description: E-pasts un/vai lietotājvārds jau ir reģistrēts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: CONFLICT
              message: User already exists
              details:
                - field: email
                  issue: ALREADY_EXISTS
    InvalidCredentials:
      description: Nepareizi pieteikšanās dati vai konts īslaicīgi bloķēts (vienāda atbilde)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INVALID_CREDENTIALS
              message: Invalid login or password
    RouteNotFound:
      description: Pieprasītais ceļš nav atrasts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Not Found
    ServerError:
      description: Servera iekšēja kļūda. Atbildē nav ievades datu.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL_ERROR
              message: Internal server error
    HtmlPage:
      description: HTML lapa (servera pusē renderēta, bez JavaScript)
      content:
        text/html:
          schema:
            type: string
    SeeOther:
      description: |
        Pāradresācija (POST → redirect → GET). Ja darbinieks nav izvēlēts,
        jebkura CRM lapa pāradresē uz `/sakums`.
      headers:
        Location:
          schema:
            type: string
    SeeOtherWithCookie:
      description: Darbinieks izvēlēts; pāradresācija uz `/kopsavilkums`
      headers:
        Location:
          schema:
            type: string
        Set-Cookie:
          description: '`crm_darbinieks=<id>; HttpOnly; Path=/; SameSite=lax`'
          schema:
            type: string
    HtmlBadRequest:
      description: "Kļūdaina ievade. Pārlūks (`Accept: text/html`) saņem formu atkārtoti ar kļūdu tekstiem pie laukiem; citi klienti saņem `Error`."
      content:
        text/html:
          schema:
            type: string
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: "Request validation failed"
    HtmlForbidden:
      description: "Lomai nav tiesību veikt šo darbību (N3)"
      content:
        text/html:
          schema:
            type: string
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: "Nav tiesību veikt šo darbību"
    HtmlNotFound:
      description: "Ieraksts vai lapa nav atrasta"
      content:
        text/html:
          schema:
            type: string
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: "Ieraksts nav atrasts"
    HtmlServerError:
      description: "Servera iekšēja kļūda. Atbildē nav ievades datu."
      content:
        text/html:
          schema:
            type: string
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL_ERROR
              message: "Internal server error"
