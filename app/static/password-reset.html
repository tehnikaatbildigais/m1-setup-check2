<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paroles atjaunošana · Ezermalas pieteikumu sistēma</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <h1>Atjaunot paroli</h1>
  <p class="lead">Ievadi reģistrēto e-pastu, un mēs izveidosim paroles atjaunošanas saiti.</p>
  <p class="notice" id="reset-sent" role="status" hidden>Ja šis e-pasts ir reģistrēts, saite ir izveidota. Tā ir derīga 30 minūtes. (Prototipā saite tiek ierakstīta servera žurnālā, e-pasts netiek sūtīts.)</p>
  <form data-endpoint="/auth/password-reset" data-success-notice="#reset-sent" novalidate>
    <p class="form-error" role="alert"></p>
    <div class="field">
      <label for="email">E-pasts</label>
      <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error">
      <p class="field-error" id="email-error" data-error-for="email"></p>
    </div>
    <button type="submit">Izveidot saiti</button>
  </form>
  <div class="links">
    <p><a href="/login">Atpakaļ uz pieteikšanos</a></p>
  </div>
</main>
<script src="/static/auth.js"></script>
</body>
</html>
