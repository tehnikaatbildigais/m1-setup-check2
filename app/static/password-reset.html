<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atjaunot paroli | Ezermalas CRM</title>
  <link rel="preload" href="/static/fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="page">
  <p class="brand">Ezermalas CRM</p>
  <h1>Atjaunot paroli</h1>
  <p class="lead">Ievadi sava konta e-pastu. Saite jaunas paroles iestatīšanai būs derīga 30 minūtes.</p>
  <p class="notice" id="reset-sent" role="status" hidden>Ja šis e-pasts ir reģistrēts, saite ir izveidota. Prototipā to atradīsi servera žurnālā, jo e-pasts netiek sūtīts.</p>
  <form data-endpoint="/auth/password-reset" data-success-notice="#reset-sent" novalidate>
    <p class="form-error" role="alert"></p>
    <div class="field">
      <label for="email">E-pasts</label>
      <input id="email" name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" required aria-describedby="email-error">
      <p class="field-error" id="email-error" data-error-for="email"></p>
    </div>
    <button type="submit">Izveidot saiti</button>
  </form>
  <div class="links">
    <p><a href="/login">Atpakaļ uz pieteikšanos</a></p>
  </div>
</main>
<footer class="auth-footer"><a href="/pieklustamiba">Piekļūstamības paziņojums</a></footer>
<script src="/static/auth.js"></script>
</body>
</html>
