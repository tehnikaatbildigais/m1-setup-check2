<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jauna parole | Ezermalas CRM</title>
  <link rel="preload" href="/static/fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="page">
  <p class="brand">Ezermalas CRM</p>
  <h1>Jauna parole</h1>
  <p class="lead">Pēc saglabāšanas vecā parole vairs nedarbosies.</p>
  <form data-endpoint="/auth/password-reset/confirm" data-redirect="/login?reset=1" novalidate>
    <p class="form-error" role="alert"></p>
    <input type="hidden" name="token">
    <p class="form-error" data-error-for="token" role="alert"></p>
    <div class="field">
      <label for="password">Jaunā parole</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="password-hint password-error">
      <p class="hint" id="password-hint">Vismaz 8 simboli.</p>
      <p class="field-error" id="password-error" data-error-for="password"></p>
    </div>
    <div class="field">
      <label for="passwordConfirm">Jaunā parole vēlreiz</label>
      <input id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" required aria-describedby="passwordConfirm-error">
      <p class="field-error" id="passwordConfirm-error" data-error-for="passwordConfirm"></p>
    </div>
    <button type="submit">Saglabāt paroli</button>
  </form>
  <div class="links">
    <p><a href="/password-reset">Pieprasīt jaunu saiti</a></p>
  </div>
</main>
<script src="/static/auth.js"></script>
</body>
</html>
