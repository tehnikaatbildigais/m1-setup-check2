name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    container: ghcr.io/mleitass/m1-devcontainer:2026-09-29
    steps:
      - uses: actions/checkout@v4
      - name: Prepare template self-check
        if: github.repository == 'mleitass/m1-setup-check'
        run: echo 'Template repository self-check; not participant evidence.' > setup/claude-answer.md
      - name: Install app dependencies (CR-5)
        run: pip install -r requirements.txt
      - run: make verify-setup
